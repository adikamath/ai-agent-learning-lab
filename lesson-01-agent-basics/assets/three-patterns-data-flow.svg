<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Expected data flows for three AI application patterns</title>
  <desc id="description">Three vertical flows shown side by side: an LLM-only application, a deterministic workflow, and a simple agent.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <style>
      .panel { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
      .node { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; }
      .model { fill: #ddf4ff; stroke: #0969da; }
      .heading { fill: #24292f; font: 600 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #24292f; font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .note { fill: #57606a; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .arrow { fill: none; stroke: #57606a; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#ffffff"/>

  <rect class="panel" x="25" y="20" width="360" height="605" rx="12"/>
  <rect class="panel" x="420" y="20" width="360" height="605" rx="12"/>
  <rect class="panel" x="815" y="20" width="360" height="605" rx="12"/>

  <text class="heading" x="205" y="58" text-anchor="middle">LLM only</text>
  <text class="heading" x="600" y="58" text-anchor="middle">Workflow / graph</text>
  <text class="heading" x="995" y="58" text-anchor="middle">Simple agent</text>

  <!-- LLM-only flow -->
  <rect class="node" x="75" y="105" width="260" height="64" rx="8"/>
  <text class="label" x="205" y="130">Question + dataset</text>
  <text class="note" x="205" y="153">supplied in the prompt</text>

  <path class="arrow" d="M 205 169 L 205 237"/>

  <rect class="node model" x="75" y="240" width="260" height="64" rx="8"/>
  <text class="label" x="205" y="272">LLM</text>

  <path class="arrow" d="M 205 304 L 205 372"/>

  <rect class="node" x="75" y="375" width="260" height="64" rx="8"/>
  <text class="label" x="205" y="407">Answer</text>

  <text class="note" x="205" y="500">One model call</text>
  <text class="note" x="205" y="520">No tools or execution loop</text>

  <!-- Deterministic workflow -->
  <rect class="node" x="470" y="82" width="260" height="56" rx="8"/>
  <text class="label" x="600" y="110">Question</text>

  <path class="arrow" d="M 600 138 L 600 174"/>

  <rect class="node" x="470" y="177" width="260" height="56" rx="8"/>
  <text class="label" x="600" y="205">Application logic</text>

  <path class="arrow" d="M 600 233 L 600 269"/>

  <rect class="node" x="470" y="272" width="260" height="56" rx="8"/>
  <text class="label" x="600" y="300">Load company data</text>

  <path class="arrow" d="M 600 328 L 600 364"/>

  <rect class="node" x="470" y="367" width="260" height="56" rx="8"/>
  <text class="label" x="600" y="395">Calculate + rank</text>

  <path class="arrow" d="M 600 423 L 600 459"/>

  <rect class="node" x="470" y="462" width="260" height="56" rx="8"/>
  <text class="label" x="600" y="490">Answer</text>

  <text class="note" x="600" y="568">Code chooses every step</text>

  <!-- Agent flow -->
  <rect class="node" x="865" y="76" width="260" height="52" rx="8"/>
  <text class="label" x="995" y="102">Goal</text>

  <path class="arrow" d="M 995 128 L 995 157"/>

  <rect class="node model" x="865" y="160" width="260" height="52" rx="8"/>
  <text class="label" x="995" y="186">LLM chooses action</text>

  <path class="arrow" d="M 995 212 L 995 241"/>

  <rect class="node" x="865" y="244" width="260" height="52" rx="8"/>
  <text class="label" x="995" y="270">Harness runs tool</text>

  <path class="arrow" d="M 995 296 L 995 325"/>

  <rect class="node" x="865" y="328" width="260" height="52" rx="8"/>
  <text class="label" x="995" y="354">Tool result</text>

  <path class="arrow" d="M 995 380 L 995 409"/>

  <rect class="node model" x="865" y="412" width="260" height="52" rx="8"/>
  <text class="label" x="995" y="438">LLM decides</text>

  <path class="arrow" d="M 995 464 L 995 493"/>

  <rect class="node" x="865" y="496" width="260" height="52" rx="8"/>
  <text class="label" x="995" y="522">Answer</text>

  <path d="M 865 438 C 820 438, 820 186, 860 186" class="arrow"/>
  <text class="note" x="850" y="314" transform="rotate(-90 850 314)">repeat if needed</text>

  <text class="note" x="995" y="590">Model chooses the next step</text>

  <!-- Legend -->
  <rect class="node model" x="390" y="655" width="30" height="20" rx="4"/>
  <text class="label" x="690" y="665">Blue boxes show where the model generates or decides.</text>
</svg>
